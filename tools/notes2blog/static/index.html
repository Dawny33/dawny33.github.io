<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>notes2blog</title>
<style>
  :root {
    --bg:#14140f; --panel:#1b1a15; --panel2:#211f19; --fg:#e8e6df; --muted:#9a978d;
    --faint:#6e6b63; --border:#2f2d26; --accent:#e08a5f; --accent-dim:#3a2a20;
    --ok:#7bb37b; --err:#d2705e;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.6}
  header{padding:1.25rem 1.75rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
  header h1{font-size:1rem;margin:0;font-weight:600;letter-spacing:-0.01em}
  header h1 span{color:var(--accent)}
  .status{font-size:0.78rem;color:var(--faint);font-family:var(--mono);margin-left:auto;text-align:right}
  .status b{color:var(--muted);font-weight:500}

  main{display:grid;grid-template-columns:minmax(340px,1fr) 1.15fr;gap:0;height:calc(100vh - 62px)}
  .col{overflow-y:auto;padding:1.75rem}
  .col.left{border-right:1px solid var(--border)}

  h2{font-size:0.72rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--faint);
     font-weight:600;margin:0 0 0.9rem}
  .step+.step{margin-top:2.25rem}

  /* dropzone */
  #drop{border:1.5px dashed var(--border);border-radius:10px;padding:2.25rem 1.25rem;text-align:center;
        cursor:pointer;transition:.15s;background:var(--panel)}
  #drop:hover,#drop.over{border-color:var(--accent);background:var(--accent-dim)}
  #drop p{margin:.4rem 0;color:var(--muted);font-size:.9rem}
  #drop .big{color:var(--fg);font-size:1rem;font-weight:500}
  #drop .hint{font-size:.78rem;color:var(--faint)}

  #thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:.6rem;margin-top:1rem}
  .thumb{position:relative;aspect-ratio:3/4;border-radius:7px;overflow:hidden;border:1px solid var(--border);background:var(--panel2)}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .thumb .n{position:absolute;top:4px;left:4px;background:rgba(0,0,0,.72);color:#fff;font-size:.66rem;
            padding:1px 6px;border-radius:99px;font-family:var(--mono)}
  .thumb .x{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.72);color:#fff;border:none;
            width:19px;height:19px;border-radius:99px;cursor:pointer;font-size:.75rem;line-height:1;padding:0}
  .thumb .x:hover{background:var(--err)}

  label.fld{display:block;font-size:.74rem;color:var(--faint);text-transform:uppercase;
            letter-spacing:.08em;margin:1rem 0 .35rem;font-weight:600}
  input[type=text],input[type=date],textarea{
    width:100%;background:var(--panel);border:1px solid var(--border);color:var(--fg);
    border-radius:7px;padding:.6rem .75rem;font-family:inherit;font-size:.92rem;resize:vertical}
  textarea{font-family:var(--mono);font-size:.85rem;line-height:1.65}
  input:focus,textarea:focus{outline:none;border-color:var(--accent)}
  .row{display:flex;gap:.75rem}
  .row>*{flex:1}

  button{font-family:inherit;font-size:.9rem;font-weight:550;border-radius:7px;cursor:pointer;
         padding:.6rem 1.1rem;border:1px solid var(--border);background:var(--panel2);color:var(--fg);transition:.15s}
  button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{background:var(--accent);border-color:var(--accent);color:#14140f}
  button.primary:hover:not(:disabled){opacity:.88;color:#14140f}
  button.approve{background:var(--ok);border-color:var(--ok);color:#0f1a0f;font-size:.95rem;padding:.7rem 1.4rem}
  button.approve:hover:not(:disabled){opacity:.88;color:#0f1a0f}
  .btnrow{display:flex;gap:.6rem;align-items:center;margin-top:1.25rem;flex-wrap:wrap}

  /* tags */
  #tags{display:flex;flex-wrap:wrap;gap:.4rem;padding:.45rem;background:var(--panel);
        border:1px solid var(--border);border-radius:7px;min-height:42px;align-items:center}
  .chip{display:inline-flex;align-items:center;gap:.35rem;background:var(--accent-dim);color:var(--accent);
        border-radius:99px;padding:.15rem .6rem;font-size:.78rem;font-family:var(--mono)}
  .chip button{all:unset;cursor:pointer;opacity:.65;font-size:.8rem;line-height:1}
  .chip button:hover{opacity:1}
  #tagin{flex:1;min-width:110px;background:none;border:none;color:var(--fg);outline:none;
         font-family:var(--mono);font-size:.82rem;padding:.15rem}
  #suggest{margin-top:.5rem;display:flex;flex-wrap:wrap;gap:.35rem}
  #suggest button{font-family:var(--mono);font-size:.72rem;padding:.12rem .55rem;border-radius:99px;
                  color:var(--faint);background:none}

  /* preview */
  .tabs{display:flex;gap:.4rem;margin-bottom:1rem}
  .tabs button{font-size:.8rem;padding:.35rem .8rem}
  .tabs button.on{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
  #preview{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:2rem 2.25rem}
  #preview .ttl{font-size:1.6rem;font-weight:660;letter-spacing:-.025em;line-height:1.2;margin:0 0 .4rem}
  #preview .meta{font-size:.8rem;color:var(--faint);margin-bottom:.75rem}
  #preview .ptags{display:flex;gap:.35rem;flex-wrap:wrap;margin-bottom:1.5rem}
  #preview .ptags span{font-family:var(--mono);font-size:.72rem;background:var(--accent-dim);
                       color:var(--accent);padding:.1rem .5rem;border-radius:99px}
  #preview .body{font-size:.97rem;line-height:1.75;color:#dedbd2}
  #preview .body h2{font-size:1.2rem;color:var(--fg);text-transform:none;letter-spacing:-.015em;
                    margin:2rem 0 .7rem;font-weight:620}
  #preview .body h3{font-size:1.03rem;margin:1.5rem 0 .5rem;font-weight:600}
  #preview .body p{margin:0 0 1.1rem}
  #preview .body pre{background:#12110d;border:1px solid var(--border);padding:.9rem;border-radius:6px;
                     overflow-x:auto;font-size:.8rem;line-height:1.55}
  #preview .body code{font-family:var(--mono);font-size:.85em;background:#12110d;padding:.1em .3em;border-radius:3px}
  #preview .body pre code{background:none;padding:0}
  #preview .body blockquote{border-left:3px solid var(--border);margin:1.2rem 0;padding-left:1rem;
                            color:var(--muted);font-style:italic}
  #preview .body table{width:100%;border-collapse:collapse;font-size:.88rem;margin:1.2rem 0}
  #preview .body th,#preview .body td{border-bottom:1px solid var(--border);padding:.45rem .6rem;text-align:left}
  #preview .body a{color:var(--accent)}

  .note{background:var(--panel2);border-left:3px solid var(--accent);border-radius:0 7px 7px 0;
        padding:.7rem .9rem;font-size:.85rem;color:var(--muted);margin-top:1rem}
  .note b{color:var(--fg)}
  .msg{margin-top:1rem;padding:.7rem .9rem;border-radius:7px;font-size:.87rem;display:none}
  .msg.show{display:block}
  .msg.ok{background:#1b2a1b;color:var(--ok);border:1px solid #2c452c}
  .msg.err{background:#2c1a17;color:var(--err);border:1px solid #4a2a24}
  .msg.info{background:var(--panel2);color:var(--muted);border:1px solid var(--border)}
  .msg a{color:inherit;font-weight:600}
  .spin{display:inline-block;width:12px;height:12px;border:2px solid var(--accent-dim);
        border-top-color:var(--accent);border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px;margin-right:.5rem}
  @keyframes s{to{transform:rotate(360deg)}}
  .hidden{display:none!important}
  .empty{color:var(--faint);text-align:center;padding:5rem 1rem;font-size:.9rem}
  @media(max-width:920px){main{grid-template-columns:1fr;height:auto}.col.left{border-right:none;border-bottom:1px solid var(--border)}}
</style>
</head>
<body>

<header>
  <h1>notes<span>2</span>blog</h1>
  <div class="status" id="status">loading…</div>
</header>

<main>
  <!-- ============ LEFT ============ -->
  <div class="col left">
    <div class="step">
      <h2>1 · Photos of your notes</h2>
      <div id="drop">
        <p class="big">Drop images here</p>
        <p>or click to choose files</p>
        <p class="hint">JPG / PNG / HEIC · multiple pages in reading order</p>
      </div>
      <input type="file" id="file" accept="image/*" multiple class="hidden">
      <div id="thumbs"></div>

      <label class="fld" for="instr">Extra direction (optional)</label>
      <input type="text" id="instr" placeholder="e.g. keep it short, this is a follow-up to the pipelines post">

      <div class="btnrow">
        <button class="primary" id="go" disabled>Read notes &amp; draft post</button>
        <span id="gomsg" style="font-size:.82rem;color:var(--faint)"></span>
      </div>
    </div>

    <div class="step hidden" id="editor">
      <h2>2 · Edit the draft</h2>

      <label class="fld" for="title">Title</label>
      <input type="text" id="title">

      <div class="row">
        <div>
          <label class="fld" for="date">Date</label>
          <input type="date" id="date">
        </div>
        <div>
          <label class="fld" for="slug">Slug</label>
          <input type="text" id="slug">
        </div>
      </div>

      <label class="fld" for="desc">Description</label>
      <input type="text" id="desc">

      <label class="fld">Tags</label>
      <div id="tags"><input id="tagin" placeholder="type + Enter"></div>
      <div id="suggest"></div>

      <label class="fld" for="body">Body (markdown)</label>
      <textarea id="body" rows="18"></textarea>

      <div class="note hidden" id="modelnote"></div>
    </div>
  </div>

  <!-- ============ RIGHT ============ -->
  <div class="col">
    <div id="placeholder" class="empty">Your draft preview will appear here.</div>

    <div id="pv" class="hidden">
      <div class="tabs">
        <button class="on" data-tab="rendered">Preview</button>
        <button data-tab="raw">Markdown</button>
      </div>

      <div id="preview">
        <h1 class="ttl"></h1>
        <div class="meta"></div>
        <div class="ptags"></div>
        <div class="body"></div>
      </div>

      <pre id="raw" class="hidden" style="background:var(--panel);border:1px solid var(--border);
           border-radius:10px;padding:1.5rem;white-space:pre-wrap;font-size:.82rem;font-family:var(--mono)"></pre>

      <div class="btnrow">
        <button class="approve" id="approve">✓ Approve &amp; Publish</button>
        <button id="refresh">Refresh preview</button>
        <label style="font-size:.8rem;color:var(--faint);display:flex;align-items:center;gap:.35rem">
          <input type="checkbox" id="ow"> overwrite existing
        </label>
      </div>
      <div class="msg" id="msg"></div>
    </div>
  </div>
</main>

<script>
const $ = s => document.querySelector(s);
let files = [], tags = [], known = [], draft = null;

/* ---------- status ---------- */
fetch('/api/status').then(r=>r.json()).then(s=>{
  known = s.known_tags || [];
  $('#status').innerHTML =
    `<b>${s.branch}</b>${s.auto_push?' · auto-push':' · commit only'} · `+
    `${s.post_count} posts · key ${s.key_set?'<span style="color:var(--ok)">set</span>':'<span style="color:var(--err)">MISSING</span>'}`;
  renderSuggest();
}).catch(()=>{ $('#status').textContent='status unavailable'; });

/* ---------- upload ---------- */
const drop = $('#drop'), fileIn = $('#file');
drop.onclick = () => fileIn.click();
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); add(e.dataTransfer.files); };
fileIn.onchange = e => add(e.target.files);

function add(list) {
  for (const f of list) if (f.type.startsWith('image/')) files.push(f);
  drawThumbs();
}
function drawThumbs() {
  const t = $('#thumbs'); t.innerHTML = '';
  files.forEach((f, i) => {
    const d = document.createElement('div'); d.className = 'thumb';
    const img = document.createElement('img'); img.src = URL.createObjectURL(f);
    const n = document.createElement('div'); n.className = 'n'; n.textContent = i + 1;
    const x = document.createElement('button'); x.className = 'x'; x.textContent = '×';
    x.onclick = ev => { ev.stopPropagation(); files.splice(i, 1); drawThumbs(); };
    d.append(img, n, x); t.append(d);
  });
  $('#go').disabled = files.length === 0;
  $('#gomsg').textContent = files.length ? `${files.length} page${files.length>1?'s':''} ready` : '';
}

/* ---------- tags ---------- */
function drawTags() {
  const box = $('#tags'), input = $('#tagin');
  [...box.querySelectorAll('.chip')].forEach(c => c.remove());
  tags.forEach((t, i) => {
    const c = document.createElement('span'); c.className = 'chip';
    c.append(document.createTextNode(t));
    const b = document.createElement('button'); b.textContent = '×';
    b.onclick = () => { tags.splice(i, 1); drawTags(); };
    c.append(b); box.insertBefore(c, input);
  });
  renderSuggest();
}
function renderSuggest() {
  const s = $('#suggest'); if (!s) return;
  const avail = known.filter(k => !tags.includes(k)).slice(0, 12);
  s.innerHTML = '';
  if (!avail.length) return;
  const lbl = document.createElement('span');
  lbl.style.cssText = 'font-size:.72rem;color:var(--faint);margin-right:.2rem';
  lbl.textContent = 'existing:'; s.append(lbl);
  avail.forEach(k => {
    const b = document.createElement('button'); b.textContent = '+' + k;
    b.onclick = () => { tags.push(k); drawTags(); };
    s.append(b);
  });
}
$('#tagin').onkeydown = e => {
  const v = e.target.value.trim().toLowerCase().replace(/\s+/g, '-');
  if ((e.key === 'Enter' || e.key === ',') && v) {
    e.preventDefault();
    if (!tags.includes(v)) tags.push(v);
    e.target.value = ''; drawTags();
  } else if (e.key === 'Backspace' && !e.target.value && tags.length) {
    tags.pop(); drawTags();
  }
};

/* ---------- transcribe ---------- */
$('#go').onclick = async () => {
  const btn = $('#go');
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>Reading your handwriting…';
  $('#gomsg').textContent = 'this takes 20-60s';
  try {
    const fd = new FormData();
    files.forEach(f => fd.append('files', f));
    fd.append('instructions', $('#instr').value);
    const r = await fetch('/api/transcribe', { method: 'POST', body: fd });
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || 'Transcription failed');
    draft = j;
    $('#title').value = j.title || '';
    $('#slug').value  = j.slug || '';
    $('#desc').value  = j.description || '';
    $('#date').value  = j.date || new Date().toISOString().slice(0,10);
    $('#body').value  = j.body || '';
    tags = j.tags || []; drawTags();
    $('#editor').classList.remove('hidden');
    if (j.notes || (j.confidence && j.confidence !== 'high')) {
      $('#modelnote').classList.remove('hidden');
      $('#modelnote').innerHTML =
        `<b>Confidence: ${j.confidence || 'n/a'}</b><br>${(j.notes||'Nothing flagged.')
          .replace(/</g,'&lt;')}`;
    }
    await refresh();
    $('#editor').scrollIntoView({behavior:'smooth'});
  } catch (e) {
    show('err', e.message);
    $('#pv').classList.remove('hidden'); $('#placeholder').classList.add('hidden');
  } finally {
    btn.disabled = false; btn.textContent = 'Read notes & draft post'; $('#gomsg').textContent = '';
  }
};

/* ---------- preview ---------- */
async function refresh() {
  const body = $('#body').value;
  const r = await fetch('/api/render', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ body })
  });
  const j = await r.json();
  $('#placeholder').classList.add('hidden');
  $('#pv').classList.remove('hidden');
  $('#preview .ttl').textContent = $('#title').value || 'Untitled';
  const d = $('#date').value;
  $('#preview .meta').textContent = d
    ? new Date(d + 'T00:00:00').toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})
    : '';
  const pt = $('#preview .ptags'); pt.innerHTML = '';
  tags.forEach(t => { const s = document.createElement('span'); s.textContent = t; pt.append(s); });
  $('#preview .body').innerHTML = j.html;
  $('#raw').textContent = body;
}
$('#refresh').onclick = refresh;
let deb; ['#body','#title','#date','#desc'].forEach(sel => {
  $(sel).addEventListener('input', () => { clearTimeout(deb); deb = setTimeout(refresh, 500); });
});
$('#title').addEventListener('blur', () => {
  if (!$('#slug').value.trim()) {
    $('#slug').value = $('#title').value.toLowerCase()
      .replace(/[^\w\s-]/g,'').trim().replace(/[\s_-]+/g,'-');
  }
});
document.querySelectorAll('.tabs button').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('.tabs button').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    const raw = b.dataset.tab === 'raw';
    $('#raw').classList.toggle('hidden', !raw);
    $('#preview').classList.toggle('hidden', raw);
  };
});

/* ---------- publish ---------- */
function show(kind, html) {
  const m = $('#msg');
  m.className = 'msg show ' + kind;
  m.innerHTML = html;
}
$('#approve').onclick = async () => {
  if (!$('#title').value.trim()) return show('err', 'Add a title first.');
  if (!$('#body').value.trim())  return show('err', 'The body is empty.');
  if (!confirm('Publish "' + $('#title').value + '" to your site?')) return;

  const btn = $('#approve');
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Publishing…';
  show('info', 'Writing the post, committing and pushing…');
  try {
    const r = await fetch('/api/publish', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        title: $('#title').value, slug: $('#slug').value, description: $('#desc').value,
        date: $('#date').value, tags, body: $('#body').value, overwrite: $('#ow').checked
      })
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || 'Publish failed');
    let msg = `<b>Published.</b><br>${j.file} · commit <code>${j.commit}</code> on <code>${j.branch}</code>`;
    msg += j.pushed
      ? `<br>Pushed. Live in a minute or two at <a href="${j.url}" target="_blank">${j.url}</a>`
      : `<br>Committed locally — AUTO_PUSH is off, so push when you're ready.`;
    show('ok', msg);
    btn.textContent = '✓ Published';
  } catch (e) {
    show('err', e.message);
    btn.disabled = false; btn.textContent = '✓ Approve & Publish';
  }
};
</script>
</body>
</html>

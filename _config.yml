# Site
name: Jalem Raj Rohit
title: Jalem Raj Rohit
description: Notes on data, machine learning, engineering, and whatever else I am thinking about.
tagline: Data & machine learning engineer. I write about systems, models, and the messy space in between.
avatar: /images/avatar.jpg
email: jrajrohit33@gmail.com

url: https://jrajrohit.me
baseurl: ""

# Social
social:
  twitter: data__wizard
  linkedin: jalemrajrohit
  github: Dawny33

# Build
permalink: /:year/:month/:title/
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'

sass:
  style: compressed

plugins:
  - jekyll-sitemap
  - jekyll-feed

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

google_analytics: UA-100336452-1

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - CNAME
  - tools/
  - vendor/
  - .env
  - .env.example

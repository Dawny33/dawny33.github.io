<footer class="site-footer">
  <div class="wrap footer-inner">
    <div class="social">
      <a href="https://twitter.com/{{ site.social.twitter }}" title="Twitter / X" rel="me noopener" target="_blank" aria-label="Twitter">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M18.9 2H22l-7.1 8.1L23.2 22h-6.6l-5.2-6.8L5.5 22H2.4l7.6-8.7L1.2 2h6.8l4.7 6.2L18.9 2zm-1.1 18.1h1.7L7.3 3.8H5.4l12.4 16.3z"/></svg>
        <span>@{{ site.social.twitter }}</span>
      </a>
      <a href="https://www.linkedin.com/in/{{ site.social.linkedin }}" title="LinkedIn" rel="me noopener" target="_blank" aria-label="LinkedIn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M4.98 3.5A2.5 2.5 0 112.5 6 2.5 2.5 0 014.98 3.5zM3 8.98h4V21H3zM9.5 8.98h3.83v1.64h.05a4.2 4.2 0 013.78-2.08c4.04 0 4.79 2.66 4.79 6.12V21h-4v-5.5c0-1.31-.02-3-1.83-3-1.83 0-2.11 1.43-2.11 2.9V21h-4z"/></svg>
        <span>/{{ site.social.linkedin }}</span>
      </a>
      <a href="https://github.com/{{ site.social.github }}" title="GitHub" rel="me noopener" target="_blank" aria-label="GitHub">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5A11.5 11.5 0 00.5 12a11.5 11.5 0 007.86 10.92c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.53-1.34-1.3-1.7-1.3-1.7-1.05-.72.08-.71.08-.71 1.17.08 1.78 1.2 1.78 1.2 1.03 1.78 2.7 1.27 3.36.97.1-.75.4-1.27.73-1.56-2.56-.29-5.25-1.28-5.25-5.7 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 015.8 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.12 3.05.74.81 1.18 1.84 1.18 3.1 0 4.43-2.69 5.4-5.26 5.69.41.36.78 1.07.78 2.15v3.19c0 .31.21.67.8.56A11.5 11.5 0 0023.5 12 11.5 11.5 0 0012 .5z"/></svg>
        <span>/{{ site.social.github }}</span>
      </a>
      <a href="mailto:{{ site.email }}" title="Email" aria-label="Email">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 6 10-6"/></svg>
        <span>Email</span>
      </a>
      <a href="{{ '/feed.xml' | relative_url }}" title="RSS" aria-label="RSS">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="6" cy="18" r="2"/><path d="M4 10a10 10 0 0110 10h-3A7 7 0 004 13z"/><path d="M4 4a16 16 0 0116 16h-3A13 13 0 004 7z"/></svg>
        <span>RSS</span>
      </a>
    </div>
    <p class="copyright">© {{ 'now' | date: "%Y" }} {{ site.name }}</p>
  </div>
</footer>
